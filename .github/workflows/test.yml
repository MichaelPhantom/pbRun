# pbRun CI — 质量门禁(types + lint + unit tests)
#
# 2026-09-15 新增: 此前仓库仅有一个被 secrets gate 禁用的数据同步 workflow,
# lint 长期红(3 errors)、383 单测无 CI 守护。本 workflow 让 PR/push 必过质量门禁。
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PR 评论需要写权限; push 到 main 时不评论 (无 PR 号)
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # CI 只跑不需要原生 DB/密钥的门禁; app/data 为块存储软链(CI 无), 故单测须可脱 DB。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查(tsc)
        run: npx tsc --noEmit

      - name: MCP Server 构建(tsc -p mcp-server)
        run: npm run build:mcp

      - name: Lint(eslint)
        run: npm run lint

      # 带覆盖率运行: 门槛不达标即失败 (等同于 npm test 的门禁 + 报告产物)
      # 输出落 jest-output.txt 并随 artifact 上传 —— 失败时可离线定位 (CI 日志需 admin 才能下载)
      - name: 单元测试 + 覆盖率(jest)
        run: |
          set -o pipefail
          npm run test:coverage -- --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov 2>&1 | tee jest-output.txt

      # 失败时把 jest 输出尾部注入 step summary + annotation (CI 日志/artifact 下载需权限,
      # 而 step summary 与 annotation 是公开可读的 → 无需权限即可定位失败)
      - name: jest 失败诊断(摘要 + annotation)
        if: failure()
        run: |
          if [ ! -f jest-output.txt ]; then echo "无 jest 输出"; exit 0; fi
          {
            echo "### jest 失败诊断 (尾部 60 行)"
            echo '```'
            tail -n 60 jest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED_LINE=$(grep -m1 -E '^(FAIL|✕) ' jest-output.txt || echo '未匹配到 FAIL 行')
          FAILED_LINE=${FAILED_LINE//'%'/'%25'}
          FAILED_LINE=${FAILED_LINE//$'\n'/'%0A'}
          echo "::error title=Jest 失败::${FAILED_LINE}"

      - name: 覆盖率摘要(markdown)
        run: node scripts/testing/coverage-summary.js

      - name: 上传覆盖率报告(artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-report.md
            coverage/coverage-summary.json
            coverage/lcov.info
            jest-output.txt
          retention-days: 14

      - name: PR 覆盖率评论
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f coverage/coverage-report.md ]; then
            echo "无覆盖率摘要, 跳过评论"; exit 0
          fi
          BODY_FILE=$(mktemp)
          {
            echo "<!-- coverage-report -->"
            cat coverage/coverage-report.md
          } > "$BODY_FILE"
          # 已存在同标记评论则更新, 避免每次 push 刷屏
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments"             --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -F body=@"$BODY_FILE" >/dev/null
            echo "已更新覆盖率评论 #$EXISTING"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -F body=@"$BODY_FILE" >/dev/null
            echo "已创建覆盖率评论"
          fi

      - name: 构建(next build)
        run: npm run build
        env:
          # 构建期占位(真实值在部署环境); 避免缺 env 导致构建失败
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 生成夹具库 (真实 schema + 样本) → 构建到隔离目录 → next start → Playwright
      # (playwright webServer 负责启动; CI 无真实 DB, 故用夹具库保证页面可渲染)
      - name: 安装 Playwright 浏览器(chromium)
        run: npx playwright install --with-deps chromium

      - name: 端到端测试(Playwright)
        # set -o pipefail: 管道的退出码取 playwright 而非 tee, 否则失败会被吞成绿灯
        run: |
          set -o pipefail
          npx playwright test --project=chromium 2>&1 | tee e2e-output.txt
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 失败工件 (截图 / trace / 失败摘要) 与 HTML 报告一并上传, 成功也留报告便于抽查
      - name: 上传 Playwright 报告与失败工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-output.txt
          retention-days: 7
          if-no-files-found: ignore

      # failure 时把 e2e 摘要贴到 PR (同标记评论就地更新); 无 PR / 无文件则跳过
      - name: PR e2e 失败摘要评论
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f e2e-output.txt ]; then echo "无 e2e 输出, 跳过"; exit 0; fi
          BODY_FILE=$(mktemp)
          {
            echo "<!-- e2e-failure -->"
            echo "### e2e 失败摘要 (chromium)"
            echo
            echo '```'
            # 只保留尾部关键行, 避免评论过长 (GitHub 上限 65536 字符)
            tail -n 60 e2e-output.txt
            echo '```'
            echo
            echo "完整报告与失败工件见本次 run 的 artifact \`playwright-report\`。"
          } > "$BODY_FILE"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- e2e-failure -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -F body=@"$BODY_FILE" >/dev/null
            echo "已更新 e2e 失败评论 #$EXISTING"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -F body=@"$BODY_FILE" >/dev/null
            echo "已创建 e2e 失败评论"
          fi
